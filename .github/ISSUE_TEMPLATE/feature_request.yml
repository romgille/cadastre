name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, the solution second.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like cadastre to do?
  - type: textarea
    id: failure
    attributes:
      label: How would this fail?
      description: If it can fail, would the operator find out? Loudly or silently?
