name: Release

# A release happens when a change merged into main brings a Cargo.toml version
# that has no tag yet. The tag is created last, by `gh release create`, once
# the image is published: a failed build leaves no tag and no release.
# (A tag pushed with GITHUB_TOKEN would not trigger any workflow, so the
# release is not driven by a tag event.)
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Decide whether a release is due
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      due: ${{ steps.version.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "cannot read a X.Y.Z version from Cargo.toml (got '$version')" >&2
            exit 1
          fi
          # Only "Not Found" means the tag is free; any other failure stops
          # the run instead of being read as "no tag".
          if out="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" 2>&1)"; then
            due=false
            echo "::notice::v$version already exists, nothing to release"
          elif printf '%s' "$out" | grep -q 'Not Found'; then
            due=true
          else
            echo "cannot check for tag v$version: $out" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "due=$due" >> "$GITHUB_OUTPUT"

  release:
    name: Publish the image, tag and create the GitHub release
    needs: plan
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
      packages: write
    # One release at a time per version, never cancelled: image publication and
    # release creation are serialized, and the tag is rechecked inside the lock.
    concurrency:
      group: release-${{ needs.plan.outputs.version }}
      cancel-in-progress: false
    steps:
      - id: recheck
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if out="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" 2>&1)"; then
            echo "::notice::v$VERSION was released while this run was queued"
            echo "due=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q 'Not Found'; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "cannot check for tag v$VERSION: $out" >&2
            exit 1
          fi

      - if: steps.recheck.outputs.due == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.recheck.outputs.due == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.recheck.outputs.due == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.recheck.outputs.due == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.recheck.outputs.due == 'true'
        id: minor
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: echo "value=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      - if: steps.recheck.outputs.due == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.plan.outputs.version }}
            type=raw,value=${{ steps.minor.outputs.value }}
            type=raw,value=latest

      - if: steps.recheck.outputs.due == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=v${{ needs.plan.outputs.version }}

      # Creates the tag on the commit that was built.
      - if: steps.recheck.outputs.due == 'true'
        name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
